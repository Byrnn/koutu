name: Semantic UI Components

on:
  push:
    branches:
      - main
    paths:
      - reference_ui.jpg
      - components.json
      - process.py
      - batch_process.py
      - requirements.txt
      - .github/workflows/components.yml
  workflow_dispatch:
    inputs:
      config:
        description: 'Component config JSON committed in the repository'
        required: true
        default: 'components.json'
      output:
        description: 'Output directory'
        required: true
        default: 'components_output'

jobs:
  components:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run semantic component matting
        run: |
          python batch_process.py \
            --config "${{ inputs.config }}" \
            --output "${{ inputs.output }}"

      - name: Upload component results
        uses: actions/upload-artifact@v4
        with:
          name: semantic-ui-components
          path: ${{ inputs.output }}/
          if-no-files-found: error
